<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Checkout — SourceLab</title>

  <meta
    name="description"
    content="Complete your SourceLab order securely."
  >

  <meta property="og:title" content="Checkout — SourceLab">
  <meta
    property="og:description"
    content="Complete your SourceLab order."
  >
  <meta property="og:type" content="website">

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2306070a'/%3E%3Cpath d='M16 18h31l-7 8H24a6 6 0 000 12h13a11 11 0 010 22H12l7-8h18a3 3 0 000-6H24a14 14 0 010-28z' fill='white'/%3E%3Cpath d='M47 18v25h9l6 9H41l6-8z' fill='%230066ff'/%3E%3C/svg%3E"
  >

  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    /* Checkout-specific styles */

    .checkout-page {
      padding-top: 72px;
      padding-bottom: 96px;
    }

    .checkout-page-head {
      margin-bottom: 42px;
      max-width: 720px;
    }

    .checkout-page-head h1 {
      margin-bottom: 14px;
    }

    .checkout-page-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr);
      gap: 32px;
      align-items: start;
    }

    .checkout-card,
    .checkout-summary {
      border: 1px solid rgba(0, 0, 0, .10);
      background: #fff;
      border-radius: 18px;
      padding: 28px;
    }

    .checkout-card + .checkout-card {
      margin-top: 18px;
    }

    .checkout-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .checkout-card-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .checkout-items {
      display: grid;
      gap: 18px;
    }

    .checkout-item {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr) auto;
      gap: 16px;
      align-items: center;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(0, 0, 0, .08);
    }

    .checkout-item:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .checkout-item-image {
      width: 88px;
      height: 88px;
      border-radius: 12px;
      overflow: hidden;
      background: #f2f3f5;
    }

    .checkout-item-image img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .checkout-item-info {
      min-width: 0;
    }

    .checkout-item-title {
      margin: 0 0 5px;
      font-size: 16px;
      font-weight: 650;
    }

    .checkout-item-meta {
      color: #6c7078;
      font-size: 14px;
      line-height: 1.5;
    }

    .checkout-item-price {
      white-space: nowrap;
      font-size: 15px;
      font-weight: 650;
    }

    .checkout-summary {
      position: sticky;
      top: 24px;
    }

    .checkout-summary h2 {
      margin: 0 0 24px;
      font-size: 20px;
    }

    .summary-lines {
      display: grid;
      gap: 13px;
    }

    .summary-line {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      color: #62666e;
      font-size: 15px;
    }

    .summary-line strong {
      color: #101114;
      font-weight: 600;
    }

    .summary-total {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(0, 0, 0, .10);
      font-size: 19px;
      font-weight: 700;
    }

    .summary-currency {
      color: #747982;
      font-size: 12px;
      margin-top: 4px;
      text-align: right;
    }

    .checkout-order-id {
      margin-top: 24px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #f5f6f7;
      font-size: 13px;
      color: #62666e;
      overflow-wrap: anywhere;
    }

    .checkout-order-id strong {
      display: block;
      margin-top: 4px;
      color: #101114;
      font-family: monospace;
      font-size: 12px;
    }

    .checkout-form {
      display: grid;
      gap: 18px;
    }

    .checkout-form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .checkout-field {
      display: grid;
      gap: 7px;
    }

    .checkout-field label {
      font-size: 13px;
      font-weight: 600;
    }

    .checkout-field input {
      width: 100%;
      box-sizing: border-box;
      min-height: 46px;
      border: 1px solid #d9dce1;
      border-radius: 9px;
      padding: 0 13px;
      background: #fff;
      color: #111;
      font: inherit;
      outline: none;
    }

    .checkout-field input:focus {
      border-color: #0066ff;
      box-shadow: 0 0 0 3px rgba(0, 102, 255, .10);
    }

    .checkout-button {
      width: 100%;
      min-height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 10px;
      background: #0066ff;
      color: #fff;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: opacity .15s ease, transform .15s ease;
    }

    .checkout-button:hover {
      opacity: .92;
    }

    .checkout-button:active {
      transform: translateY(1px);
    }

    .checkout-button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .checkout-note {
      margin-top: 12px;
      color: #777c84;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .checkout-status {
      padding: 18px;
      border-radius: 12px;
      background: #f5f6f7;
      color: #555a62;
    }

    .checkout-status.error {
      background: #fff1f1;
      color: #b42318;
    }

    .checkout-empty {
      padding: 34px 10px;
      text-align: center;
      color: #686d75;
    }

    .checkout-empty a {
      display: inline-block;
      margin-top: 16px;
    }

    .checkout-back {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 28px;
      color: #686d75;
      font-size: 14px;
    }

    .checkout-back a {
      color: inherit;
      text-decoration: none;
    }

    @media (max-width: 820px) {
      .checkout-page-grid {
        grid-template-columns: 1fr;
      }

      .checkout-summary {
        position: static;
      }

      .checkout-form-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .checkout-card,
      .checkout-summary {
        padding: 20px;
        border-radius: 14px;
      }

      .checkout-item {
        grid-template-columns: 64px minmax(0, 1fr);
      }

      .checkout-item-image {
        width: 64px;
        height: 64px;
      }

      .checkout-item-price {
        grid-column: 2;
      }

      .checkout-back {
        flex-direction: column;
      }
    }
  </style>
</head>

<body data-page="checkout">

  <a class="skip-link" href="#main">
    Skip to content
  </a>

  <div data-site-header></div>

  <main id="main" class="checkout-page shell">

    <div class="checkout-page-head">
      <p class="eyebrow">
        <span></span>
        Secure checkout
      </p>

      <h1>Checkout.</h1>

      <p>
        Review your order and complete your purchase.
      </p>
    </div>

    <div
      id="checkout-status"
      class="checkout-status"
      hidden
    ></div>

    <div
      id="checkout-content"
      class="checkout-page-grid"
      hidden
    >

      <div>

        <!-- ORDER ITEMS -->
        <section class="checkout-card">

          <div class="checkout-card-head">
            <h2>Your order</h2>

            <span id="checkout-item-count">
              —
            </span>
          </div>

          <div
            id="checkout-items"
            class="checkout-items"
          ></div>

        </section>

        <!-- CUSTOMER DETAILS -->
        <section class="checkout-card">

          <div class="checkout-card-head">
            <h2>Customer details</h2>
          </div>

          <form
            id="checkout-form"
            class="checkout-form"
          >

            <div class="checkout-form-row">

              <div class="checkout-field">
                <label for="first-name">
                  First name
                </label>

                <input
                  id="first-name"
                  name="first_name"
                  type="text"
                  autocomplete="given-name"
                  required
                >
              </div>

              <div class="checkout-field">
                <label for="last-name">
                  Last name
                </label>

                <input
                  id="last-name"
                  name="last_name"
                  type="text"
                  autocomplete="family-name"
                  required
                >
              </div>

            </div>

            <div class="checkout-field">
              <label for="email">
                Email address
              </label>

              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                required
              >
            </div>

            <button
              id="checkout-button"
              class="checkout-button"
              type="submit"
            >
              Complete order
            </button>

            <p class="checkout-note">
              Your order is created securely by SourceLab.
            </p>

          </form>

        </section>

      </div>

      <!-- SUMMARY -->
      <aside class="checkout-summary">

        <h2>Order summary</h2>

        <div class="summary-lines">

          <div class="summary-line">
            <span>Items</span>
            <strong id="summary-item-count">—</strong>
          </div>

          <div class="summary-line">
            <span>Currency</span>
            <strong id="summary-currency">GBP</strong>
          </div>

        </div>

        <div class="summary-total">
          <span>Total</span>
          <span id="summary-total">£0.00</span>
        </div>

        <div class="summary-currency">
          GBP
        </div>

        <div class="checkout-order-id">
          Order session
          <strong id="summary-order-id">—</strong>
        </div>

      </aside>

    </div>

    <div class="checkout-back">

      <a href="cart.html">
        ← Back to cart
      </a>

      <span>
        Secure checkout.
      </span>

    </div>

  </main>

  <div data-site-footer></div>

  <script src="assets/js/products.js"></script>
  <script src="assets/js/account.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    /*
     * SourceLab checkout
     *
     * Expected cart format in localStorage:
     *
     * [
     *   { "id": "product-id", "qty": 2 },
     *   { "id": "another-id", "qty": 1 }
     * ]
     *
     * Change CART_STORAGE_KEY below if your cart.js
     * uses a different localStorage key.
     */

    const API_BASE = "";
    const CART_STORAGE_KEY = "cart";

    const statusEl = document.getElementById("checkout-status");
    const contentEl = document.getElementById("checkout-content");
    const itemsEl = document.getElementById("checkout-items");

    const itemCountEl = document.getElementById("checkout-item-count");
    const summaryItemCountEl =
      document.getElementById("summary-item-count");

    const summaryTotalEl =
      document.getElementById("summary-total");

    const summaryCurrencyEl =
      document.getElementById("summary-currency");

    const summaryOrderIdEl =
      document.getElementById("summary-order-id");

    const form = document.getElementById("checkout-form");
    const checkoutButton =
      document.getElementById("checkout-button");


    /*
     * -----------------------------
     * Helpers
     * -----------------------------
     */

    function showStatus(message, isError = false) {
      statusEl.hidden = false;
      statusEl.textContent = message;
      statusEl.classList.toggle("error", isError);
    }


    function hideStatus() {
      statusEl.hidden = true;
      statusEl.classList.remove("error");
      statusEl.textContent = "";
    }


    function getCart() {
      try {
        const raw = localStorage.getItem(CART_STORAGE_KEY);

        if (!raw) {
          return [];
        }

        const cart = JSON.parse(raw);

        if (!Array.isArray(cart)) {
          return [];
        }

        return cart
          .map(item => ({
            id: item.id,
            qty: Number(item.qty)
          }))
          .filter(item =>
            item.id !== undefined &&
            item.id !== null &&
            Number.isFinite(item.qty) &&
            item.qty > 0
          );

      } catch (error) {
        console.error("Unable to read cart:", error);
        return [];
      }
    }


    function formatMoney(value, currency = "GBP") {
      return new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency
      }).format(Number(value) || 0);
    }


    /*
     * Handles several common image property names.
     *
     * If your API always returns `image`, this still works.
     * If it returns `images: []`, this also works.
     */

    function getProductImage(product) {
      if (typeof product.image === "string") {
        return product.image;
      }

      if (typeof product.image_url === "string") {
        return product.image_url;
      }

      if (typeof product.thumbnail === "string") {
        return product.thumbnail;
      }

      if (
        Array.isArray(product.images) &&
        product.images.length > 0
      ) {
        const first = product.images[0];

        if (typeof first === "string") {
          return first;
        }

        if (first && typeof first.url === "string") {
          return first.url;
        }

        if (first && typeof first.src === "string") {
          return first.src;
        }
      }

      return null;
    }


    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }


    /*
     * -----------------------------
     * Create order session
     * -----------------------------
     *
     * IMPORTANT:
     *
     * The browser sends only IDs + quantities.
     *
     * The API resolves the actual product data and
     * calculates the total.
     */

    async function createOrderSession(cart) {

      const response = await fetch(
        `${API_BASE}/api/order`,
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            products: cart
          })
        }
      );

      let data = null;

      try {
        data = await response.json();
      } catch {
        data = null;
      }

      if (!response.ok) {
        const errorCode =
          data?.error ?? response.status;

        throw new Error(
          `Unable to create order (${errorCode}).`
        );
      }

      return data;
    }


    /*
     * -----------------------------
     * Render products
     * -----------------------------
     */

    function renderItems(order) {

      const products = Array.isArray(order.products)
        ? order.products
        : [];

      itemsEl.innerHTML = "";

      let totalQuantity = 0;

      products.forEach(product => {

        const quantity =
          Number(product.qty) > 0
            ? Number(product.qty)
            : 1;

        totalQuantity += quantity;

        const image = getProductImage(product);

        const imageHTML = image
          ? `
            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(product.name || product.title || "Product")}"
              loading="lazy"
            >
          `
          : `
            <div
              style="
                width:100%;
                height:100%;
                display:grid;
                place-items:center;
                color:#8a8f97;
                font-size:12px;
              "
              aria-hidden="true"
            >
              No image
            </div>
          `;

        const name =
          product.name ||
          product.title ||
          "Untitled product";

        const lineTotal =
          Number(product.price || 0) * quantity;

        const item = document.createElement("article");

        item.className = "checkout-item";

        item.innerHTML = `
          <div class="checkout-item-image">
            ${imageHTML}
          </div>

          <div class="checkout-item-info">

            <h3 class="checkout-item-title">
              ${escapeHTML(name)}
            </h3>

            <div class="checkout-item-meta">
              Quantity: ${quantity}
            </div>

          </div>

          <div class="checkout-item-price">
            ${formatMoney(
              lineTotal,
              order.currency || "GBP"
            )}
          </div>
        `;

        itemsEl.appendChild(item);
      });

      itemCountEl.textContent =
        `${totalQuantity} ${
          totalQuantity === 1 ? "item" : "items"
        }`;

      summaryItemCountEl.textContent =
        String(totalQuantity);
    }


    /*
     * -----------------------------
     * Render summary
     * -----------------------------
     */

    function renderSummary(order) {

      const currency =
        order.currency || "GBP";

      summaryCurrencyEl.textContent =
        currency;

      summaryTotalEl.textContent =
        formatMoney(
          order.total_due,
          currency
        );

      summaryOrderIdEl.textContent =
        order.order_id || "—";
    }


    /*
     * -----------------------------
     * Initialise checkout
     * -----------------------------
     */

    async function initialiseCheckout() {

      hideStatus();

      const cart = getCart();

      if (cart.length === 0) {

        showStatus(
          "Your cart is empty.",
          false
        );

        contentEl.hidden = false;

        itemsEl.innerHTML = `
          <div class="checkout-empty">
            <p>
              There are no products to check out.
            </p>

            <a href="products.html">
              Continue shopping →
            </a>
          </div>
        `;

        return;
      }

      try {

        /*
         * This request is the source of truth.
         *
         * The server validates the product IDs,
         * resolves product information and calculates
         * the total.
         */

        const order =
          await createOrderSession(cart);

        if (!order || !Array.isArray(order.products)) {
          throw new Error(
            "The server returned an invalid order."
          );
        }

        renderItems(order);
        renderSummary(order);

        contentEl.hidden = false;

        /*
         * Store the server-created order session so the
         * next checkout/payment step can retrieve it.
         */

        sessionStorage.setItem(
          "sourcelab_checkout_order_id",
          order.order_id
        );

      } catch (error) {

        console.error(
          "Checkout initialisation failed:",
          error
        );

        showStatus(
          error.message ||
          "Unable to load checkout.",
          true
        );

      }
    }


    /*
     * -----------------------------
     * Customer form
     * -----------------------------
     *
     * Your current /api/order endpoint only creates
     * the order and stores customer: null.
     *
     * Therefore this example validates the customer
     * information on the frontend but does not pretend
     * that the API has saved it.
     *
     * Connect this submit handler to your payment/order
     * completion endpoint when that endpoint exists.
     */

    form.addEventListener(
      "submit",
      async event => {

        event.preventDefault();

        if (!form.reportValidity()) {
          return;
        }

        const orderId =
          sessionStorage.getItem(
            "sourcelab_checkout_order_id"
          );

        if (!orderId) {
          showStatus(
            "Your checkout session has expired. Please return to your cart.",
            true
          );

          return;
        }

        const formData =
          new FormData(form);

        const customer = {
          first_name:
            formData.get("first_name"),

          last_name:
            formData.get("last_name"),

          email:
            formData.get("email")
        };

        /*
         * At this point you need an endpoint such as:
         *
         * POST /api/order/{order_id}/customer
         *
         * or your payment provider's checkout endpoint.
         *
         * Do NOT send payment/card information to the
         * current /api/order endpoint.
         */

        console.log(
          "Checkout customer:",
          customer
        );

        checkoutButton.disabled = true;
        checkoutButton.textContent =
          "Processing…";

        try {

          /*
           * Replace this section with your actual
           * payment/checkout API call.
           */

          await new Promise(resolve =>
            setTimeout(resolve, 500)
          );

          showStatus(
            `Order ${orderId} is ready for payment.`,
            false
          );

        } finally {

          checkoutButton.disabled = false;
          checkoutButton.textContent =
            "Complete order";
        }
      }
    );


    initialiseCheckout();
  </script>

</body>
</html>
